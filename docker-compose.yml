services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: delivery_support
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_support"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    environment:
      DELIVERY_SUPPORT_API_URL: http://api:8000/api/v1
      DELIVERY_SUPPORT_API_TOKEN: ${DEMO_ACCESS_TOKEN:-dev-demo-token}
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data: